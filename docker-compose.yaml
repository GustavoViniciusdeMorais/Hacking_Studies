version: '3.5'

services:
    metasploitable2:
        image: tleemcjr/metasploitable2
        tty: true
        container_name: metasploitable2
        ports:
            - 83:80
        volumes:
            - ./:/home/gustavo
        networks:
            kali-app-network:
                ipv4_address: 10.0.0.6
    
    ubuntu:
        build:
            context: .
            dockerfile: ubuntu.dockerfile
        container_name: ubuntu
        ports:
            - 8080:80
            - "67:67/udp"
            - 2068:68
            - 2021:21
            - 3307:3306
        volumes:
            - ./:/var/www/html
        cap_add:
            - NET_ADMIN
        networks:
            kali-app-network:
                ipv4_address: 10.0.0.3
    
    parrot:
        build:
            context: .
            dockerfile: parrot.dockerfile
        volumes:
            - ./:/var/www/html
        ports:
            - 81:81
        cap_add:
            - NET_ADMIN
        container_name: parrot
        networks:
            kali-app-network:
                ipv4_address: 10.0.0.4

networks:
    kali-app-network:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: "10.0.0.0/16"